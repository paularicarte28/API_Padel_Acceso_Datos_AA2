name: Postman Integration Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  integration-tests:
    name: Run Postman Tests
    runs-on: ubuntu-latest

    # -------------------------------------------------------
    # MariaDB como servicio (igual que tu docker-compose)
    # -------------------------------------------------------
    services:
      mariadb:
        image: mariadb:11.3.2
        env:
          MYSQL_DATABASE: padelzgz
          MYSQL_USER: padeluser
          MYSQL_PASSWORD: padelpass
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build del JAR (sin tests unitarios, los hacemos con Postman)
      - name: Build with Maven (skip unit tests)
        run: mvn clean package -DskipTests

      # 4. Arrancar la API en background apuntando a la MariaDB del servicio
      - name: Start Spring Boot API
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:mariadb://localhost:3306/padelzgz
          DB_USERNAME: padeluser
          DB_PASSWORD: padelpass
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: 86400000
        run: |
          java -jar target/*.jar \
            --spring.profiles.active=prod \
            --spring.datasource.url=jdbc:mariadb://localhost:3306/padelzgz \
            --spring.datasource.username=padeluser \
            --spring.datasource.password=padelpass \
            --jwt.secret=$JWT_SECRET \
            --jwt.expiration=86400000 &
          echo "API PID: $!"

      # 5. Esperar a que la API responda (hasta 60 s)
      - name: Wait for API to be ready
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/clubs > /dev/null 2>&1; then
              echo "API is up after ${i}*2 seconds"
              break
            fi
            echo "Attempt $i/30 - not ready yet..."
            sleep 2
          done
          curl -sf http://localhost:8080/clubs || (echo "API did not start in time" && exit 1)

      # 6. Instalar Newman (CLI de Postman)
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      # 7. Ejecutar la colección Postman
      - name: Run Postman collection
        run: |
          newman run postman/PadelZGZ_API_RUNNER.postman_collection.json \
            --env-var "baseUrl=http://localhost:8080" \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export results/newman-report.xml \
            --reporter-htmlextra-export results/newman-report.html \
            --iteration-count 1 \
            --timeout-request 10000 \
            --delay-request 200

      # 8. Publicar resultados en GitHub
      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'results/newman-report.xml'
          check_name: 'Postman Test Results'

      # 9. Subir el HTML report como artefacto descargable
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-html-report
          path: results/newman-report.html
          retention-days: 7
